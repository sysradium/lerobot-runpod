[project]
name = "lerobot-runpod"
version = "0.1.0"
description = "Train LeRobot policies on RunPod GPUs from LeLab datasets and bring the model back into LeLab"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["textual>=0.80"]

[project.scripts]
lerobot-runpod = "lerobot_runpod.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_runpod"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
